# Reverse proxy and static file server for PulseWatch.
#
# Only two things are reachable from outside: the dashboard's static files
# and /api/. The API's /docs, /metrics, /healthz and /readyz are deliberately
# NOT routed, so they stay on the internal network.

# Docker's embedded DNS. Used to re-resolve the API's address while running.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream pulsewatch_api {
  # "resolve" re-resolves the name as the DNS answer expires, so a recreated
  # API container (new IP) is picked up without restarting nginx. It needs
  # the shared-memory zone below. Supported in open-source nginx >= 1.27.3.
  zone pulsewatch_api 64k;
  server api:3000 resolve;
  # Reuse connections to the API instead of opening one per request. Without
  # this pool, a load test at ~2,700 requests/s exhausted nginx's local ports
  # and 81% of requests failed with 502 (ADR-025).
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Security headers for the dashboard. The CSP allows only same-origin
  # scripts, styles, images and requests: an injected script tag pointing
  # anywhere else is refused by the browser.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # nginx's own liveness probe, for the container health check.
  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location /api/ {
    proxy_pass http://pulsewatch_api;
    proxy_http_version 1.1;
    # Required for upstream keepalive: drop the client's Connection header.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # OVERWRITE rather than append. The API trusts this header (TRUST_PROXY)
    # for rate limiting by client IP; appending would keep any value the
    # client sent, letting it choose its own IP and dodge the limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 128k;
  }

  # Server-Sent Events: no buffering, and long-lived connections.
  location = /api/v1/events {
    proxy_pass http://pulsewatch_api;
    proxy_http_version 1.1;
    # Required for upstream keepalive: drop the client's Connection header.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Fingerprinted build assets never change, so they can be cached forever.
  # (add_header here replaces the server-level headers, so repeat the
  # ones that matter for scripts.)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html and the router takes over.
  # index.html itself is never cached, so a new deploy is picked up at once.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri /index.html;
  }
}
