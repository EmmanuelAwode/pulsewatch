packages:
  - "apps/*"
  - "packages/*"

# pnpm does not run dependency install scripts unless they are listed here
# (supply-chain hardening). Each entry is a package that genuinely needs one.
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - esbuild

# Optional native speed-ups pulled in by Testcontainers; it works without them.
ignoredBuiltDependencies:
  - cpu-features
  - ssh2

# Peer dependencies are declared explicitly rather than installed
# automatically. Auto-installing pulled optional peers into production
# images, e.g. @prisma/client brought in the whole Prisma CLI, TypeScript and
# Prisma Studio, more than doubling the API image size.
autoInstallPeers: false
