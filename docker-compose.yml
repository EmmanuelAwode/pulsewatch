# PulseWatch with Docker Compose.
#
# Development infrastructure only (Postgres + Redis; run the apps with pnpm):
#   pnpm infra:up
#
# The whole application in containers (adds migrate, api, worker and web):
#   JWT_ACCESS_SECRET=$(openssl rand -base64 48) docker compose --profile app up -d --build
#   then open http://localhost:8080
#
# Only the web container is published (on 127.0.0.1). The API, worker,
# database and Redis are reachable solely on the internal Compose network.
name: pulsewatch

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-pulsewatch}:${POSTGRES_PASSWORD:-pulsewatch_dev_password}@postgres:5432/${POSTGRES_DB:-pulsewatch}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    ports:
      # Bound to loopback, so the dev database is never reachable from the
      # local network. Host port 5433 avoids a Postgres already installed on
      # the host, which normally owns 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ requires it. With any other policy Redis may delete
    #   queue keys under memory pressure, silently dropping jobs.
    # appendonly: persist writes to disk so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Application (profile "app") -------------------------------------------

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsewatch}:${POSTGRES_PASSWORD:-pulsewatch_dev_password}@postgres:5432/${POSTGRES_DB:-pulsewatch}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: [app]
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    restart: unless-stopped
    environment:
      <<: *app-env
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET (at least 32 random characters)}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      # Requests reach the API only through nginx, which overwrites
      # X-Forwarded-For with the real client address.
      TRUST_PROXY: "true"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-PulseWatch <alerts@localhost>}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # Give in-flight checks (up to 30 s) time to finish on `docker compose stop`.
    stop_grace_period: 40s

  web:
    profiles: [app]
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
